<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta
      name="description"
      content="Enterprise Compliance Platform — ISO 27001 · TISAX · ISO 9001"
    />

    <!--
      Content-Security-Policy:
      - style-src: allow self, inline AND Google Fonts CDN
      - font-src:  allow self, data URIs AND gstatic (Google Fonts files)
      - connect-src: allow backend + WebSocket
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' data: blob:;
        script-src  'self' 'unsafe-inline' 'unsafe-eval';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' data: https://fonts.gstatic.com;
        img-src     'self' data: blob:;
        connect-src 'self'
                    http://localhost:8000 http://127.0.0.1:8000
                    ws://localhost:8000   ws://127.0.0.1:8000;
        object-src  'none';
        base-uri    'self';
        form-action 'self';
      "
    />

    <!-- Inter font — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Compliance Platform</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="notranslate"></div>
  </body>
</html>

# ==============================================================
# SonarQube — Enterprise ISO Compliance Platform
# Project Key MUST match exactly what is created in SonarQube UI
# sonar.host.url is intentionally ABSENT — injected by Jenkins
# via withSonarQubeEnv('SonarQube')
# sonar.token is intentionally ABSENT — injected by Jenkins
# via the sonarqube-token credential
# ==============================================================

sonar.projectKey=enterprise-iso-compliance
sonar.projectName=Enterprise ISO Compliance Platform
sonar.projectVersion=1.0

# Encoding — mandatory for Windows agents
sonar.sourceEncoding=UTF-8

# Sources to analyse (relative to workspace root)
sonar.sources=backend,frontend/src

# Python version
sonar.python.version=3.11

# Exclusions — keep pycache, venv, node_modules, migrations out
sonar.exclusions=\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/build/**,\
  **/dist/**,\
  **/static/**,\
  **/media/**,\
  **/*.min.js,\
  **/*.css.map,\
  **/artifacts/**,\
  **/*.pyc,\
  **/*.pyo

# Test sources
sonar.tests=backend
sonar.test.inclusions=**/tests.py,**/test_*.py,**/tests_*.py

# Coverage reports (optional — remove if not generated)
# sonar.python.coverage.reportPaths=coverage.xml
